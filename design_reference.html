<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trio - Trusted Connection</title>

    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>

    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#00356B', // Yale Blue
                        ai: '#F59E0B',      // Gold/Amber
                        'bg-light': '#F9FAFB',
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    }
                }
            }
        }
    </script>

    <!-- Framer Motion -->
    <script src="https://unpkg.com/framer-motion@10.16.4/dist/framer-motion.js"></script>

    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');

        body {
            font-family: 'Inter', sans-serif;
            background-color: #F9FAFB;
        }

        /* Custom Scrollbar for Chat */
        .scrollbar-hide::-webkit-scrollbar {
            display: none;
        }

        .scrollbar-hide {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
</head>

<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;
        const { motion, AnimatePresence } = window.Motion;

        // --- ICONS ---
        const UserIcon = () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2" /><circle cx="12" cy="7" r="4" /></svg>;
        const MessageCircle = () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="m3 21 1.9-5.7a8.5 8.5 0 1 1 3.8 3.8z" /></svg>;
        const Plus = () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M5 12h14" /><path d="M12 5v14" /></svg>;
        const ArrowLeft = () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="m12 19-7-7 7-7" /><path d="M19 12H5" /></svg>;
        const Sparkles = ({ size = 24 }) => <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="m12 3-1.912 5.813a2 2 0 0 1-1.275 1.275L3 12l5.813 1.912a2 2 0 0 1 1.275 1.275L12 21l1.912-5.813a2 2 0 0 1 1.275-1.275L21 12l-5.813-1.912a2 2 0 0 1-1.275-1.275L12 3Z" /><path d="M5 3v4" /><path d="M9 3v4" /><path d="M3 5h4" /><path d="M3 9h4" /></svg>;
        const ChevronRight = () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="m9 18 6-6-6-6" /></svg>;

        // --- COMPONENTS ---

        const Avatar = ({ type, name, size = "md" }) => {
            const sizeClass = size === "lg" ? "w-12 h-12" : size === "sm" ? "w-8 h-8" : "w-10 h-10";
            let bgClass = "bg-gray-200";
            let textClass = "text-gray-600";
            let content = name ? name[0] : <UserIcon size={16} />;

            if (type === "ai") {
                bgClass = "bg-ai text-white";
                content = <Sparkles size={size === 'lg' ? 20 : 14} />;
            } else if (type === "me") {
                bgClass = "bg-primary text-white";
                content = "Me";
            }
            // type === 'partner' or undefined is default gray

            return (
                <div className={`${sizeClass} ${bgClass} rounded-full flex items-center justify-center font-bold shadow-sm relative text-sm select-none`}>
                    {content}
                </div>
            );
        };

        const ChatBubble = ({ msg }) => {
            return (
                <motion.div
                    initial={{ opacity: 0, y: 10 }}
                    animate={{ opacity: 1, y: 0 }}
                    className={`flex flex-col ${msg.sender === 'me' ? 'items-end' : 'items-start'} mb-4`}
                >
                    {/* Name Label */}
                    {msg.sender !== 'me' && msg.name && <span className="text-xs text-gray-500 mb-1 ml-1">{msg.name}</span>}

                    <div className={`max-w-[75%] p-3.5 rounded-2xl shadow-sm relative ${msg.sender === 'me'
                        ? 'bg-primary text-white rounded-tr-none'
                        : msg.sender === 'ai'
                            ? 'bg-ai text-white rounded-tl-none'
                            : 'bg-white text-gray-800 rounded-tl-none border border-gray-100'
                        }`}>
                        <p className="text-sm leading-relaxed">{msg.text}</p>
                    </div>
                </motion.div>
            );
        };

        // --- SCREEN: HOME ---
        const HomeScreen = ({ conversations, onOpenRequest, onOpenChat }) => {
            return (
                <motion.div
                    initial={{ opacity: 0 }}
                    animate={{ opacity: 1 }}
                    exit={{ opacity: 0 }}
                    className="flex flex-col h-full bg-white transition-colors"
                >
                    {/* Header */}
                    <div className="bg-white border-b border-gray-100 p-4 sticky top-0 z-10 flex justify-between items-center">
                        <h1 className="text-2xl font-bold text-primary tracking-tight">Trio</h1>
                    </div>

                    {/* Chat List */}
                    <div className="flex-1 overflow-y-auto p-2">
                        {conversations.map(chat => (
                            <div
                                key={chat.id}
                                onClick={() => onOpenChat(chat.id)}
                                className="flex items-center p-3 hover:bg-gray-50 rounded-xl cursor-pointer transition-colors mb-2 group"
                            >
                                {chat.isGroup ? (
                                    <div className="flex -space-x-3 mr-3">
                                        <Avatar type="ai" />
                                        <Avatar name={chat.partnerName} />
                                    </div>
                                ) : (
                                    <div className="mr-3">
                                        <Avatar name={chat.partnerName} />
                                    </div>
                                )}

                                <div className="flex-1 border-b border-gray-50 pb-3 group-last:border-none">
                                    <div className="flex justify-between items-baseline">
                                        <h3 className="font-semibold text-gray-900">{chat.title}</h3>
                                        <span className="text-xs text-gray-400">{chat.time}</span>
                                    </div>
                                    <p className="text-sm text-gray-500 truncate" dangerouslySetInnerHTML={{ __html: chat.preview }}></p>
                                </div>
                            </div>
                        ))}
                    </div>

                    {/* FAB */}
                    <div className="p-6 absolute bottom-6 w-full flex justify-center pointer-events-none">
                        <button
                            onClick={onOpenRequest}
                            className="pointer-events-auto shadow-lg bg-primary hover:bg-blue-900 text-white rounded-full px-6 py-4 flex items-center gap-2 transition-transform active:scale-95 font-medium text-lg"
                        >
                            <Sparkles size={20} />
                            <span>Ask Trio</span>
                        </button>
                    </div>
                </motion.div>
            );
        };

        // --- SCREEN: STATIC CHAT (PAST) ---
        const StaticChatScreen = ({ chat, onBack }) => {
            // Scroll to bottom on mount
            const endRef = useRef(null);
            useEffect(() => {
                endRef.current?.scrollIntoView();
            }, []);

            return (
                <motion.div
                    initial={{ opacity: 0, x: 50 }}
                    animate={{ opacity: 1, x: 0 }}
                    exit={{ opacity: 0, x: 50 }}
                    className="flex flex-col h-full bg-gray-50"
                >
                    {/* Header */}
                    <div className="bg-white border-b border-gray-100 p-3 flex items-center gap-3 shadow-sm z-10">
                        <button onClick={onBack} className="p-2 hover:bg-gray-100 rounded-full transition-colors">
                            <ArrowLeft size={20} className="text-gray-600" />
                        </button>
                        <div className="flex items-center gap-2">
                            {chat.isGroup ? (
                                <div className="flex -space-x-2">
                                    <Avatar type="ai" size="sm" />
                                    <Avatar name={chat.partnerName} size="sm" />
                                </div>
                            ) : <Avatar name={chat.partnerName} size="sm" />}
                            <h1 className="text-md font-bold text-gray-900">{chat.title}</h1>
                        </div>
                    </div>

                    <div className="flex-1 overflow-y-auto p-4">
                        {chat.messages.map(msg => <ChatBubble key={msg.id} msg={msg} />)}
                        <div ref={endRef}></div>
                    </div>

                    {/* Cosmetic Input */}
                    <div className="p-4 border-t border-gray-100 bg-white">
                        <div className="w-full h-12 bg-gray-50 rounded-full flex items-center px-4 text-gray-400">
                            Type a message...
                        </div>
                    </div>
                </motion.div>
            );
        }

        // --- SCREEN: REQUEST (AI CHAT) ---
        const RequestScreen = ({ onGoToChat, onBack }) => {
            const [messages, setMessages] = useState([]);
            const [isTyping, setIsTyping] = useState(false);
            const [showAction, setShowAction] = useState(false);
            const endRef = useRef(null);

            useEffect(() => {
                let timeoutIds = [];
                // Sequence
                timeoutIds.push(setTimeout(() => {
                    setMessages(prev => [...prev, { id: 1, sender: 'ai', text: "How can I help you today?" }]);
                }, 500));
                timeoutIds.push(setTimeout(() => setIsTyping('me'), 2000));
                timeoutIds.push(setTimeout(() => {
                    setIsTyping(null);
                    setMessages(prev => [...prev, { id: 2, sender: 'me', text: "I'm starving. I need to find someone who actually appreciates good Middle Eastern food in New Haven." }]);
                }, 4000));
                timeoutIds.push(setTimeout(() => setIsTyping('ai'), 5000));
                timeoutIds.push(setTimeout(() => {
                    setIsTyping(null);
                    setMessages(prev => [...prev, { id: 3, sender: 'ai', text: "I think I have someone in mind..." }]);
                    setShowAction(true); // SHOW BUTTON
                }, 7000));

                return () => timeoutIds.forEach(clearTimeout);
            }, []);

            useEffect(() => endRef.current?.scrollIntoView({ behavior: "smooth" }), [messages, isTyping]);

            return (
                <motion.div
                    initial={{ opacity: 0, y: '100%' }}
                    animate={{ opacity: 1, y: 0 }}
                    exit={{ opacity: 0, y: '100%' }}
                    className="flex flex-col h-full bg-white"
                >
                    {/* Header */}
                    <div className="bg-white border-b border-gray-100 p-4 flex items-center gap-3 shadow-sm z-10">
                        <button onClick={onBack} className="p-2 hover:bg-gray-100 rounded-full transition-colors">
                            <ArrowLeft size={20} className="text-gray-600" />
                        </button>
                        <Avatar type="ai" size="sm" />
                        <h1 className="text-lg font-bold text-gray-900">Trio Assistant</h1>
                    </div>

                    <div className="flex-1 overflow-y-auto p-4 space-y-4">
                        {messages.map((msg) => <ChatBubble key={msg.id} msg={msg} />)}

                        {isTyping && (
                            <motion.div initial={{ opacity: 0 }} animate={{ opacity: 1 }} className={`flex ${isTyping === 'me' ? 'justify-end' : 'justify-start'}`}>
                                <div className="bg-gray-100 p-3 rounded-2xl flex gap-1">
                                    <span className="w-2 h-2 bg-gray-400 rounded-full animate-bounce"></span>
                                    <span className="w-2 h-2 bg-gray-400 rounded-full animate-bounce" style={{ animationDelay: '0.1s' }}></span>
                                    <span className="w-2 h-2 bg-gray-400 rounded-full animate-bounce" style={{ animationDelay: '0.2s' }}></span>
                                </div>
                            </motion.div>
                        )}
                        <div ref={endRef}></div>
                    </div>

                    <div className="p-4 border-t border-gray-100 bg-white min-h-[80px] flex items-center justify-center">
                        {showAction ? (
                            <motion.button
                                initial={{ scale: 0.9, opacity: 0 }}
                                animate={{ scale: 1, opacity: 1 }}
                                onClick={onGoToChat}
                                className="w-full max-w-xs bg-ai hover:bg-yellow-500 text-white font-semibold py-3 px-6 rounded-xl shadow-md flex items-center justify-center gap-2 transition-colors relative overflow-hidden"
                            >
                                <span className="absolute inset-0 bg-white/20 animate-pulse"></span>
                                <span className="relative flex items-center gap-2">Take me to the new chat <ChevronRight size={18} /></span>
                            </motion.button>
                        ) : (
                            <div className="w-full h-12 bg-gray-50 rounded-full flex items-center px-4 text-gray-400">
                                Type a message...
                            </div>
                        )}
                    </div>
                </motion.div>
            );
        };

        // --- SCREEN: GROUP CHAT (LIVE) ---
        const ChatScreen = ({ onBackWithHistory }) => {
            const [messages, setMessages] = useState([]);
            const [typingUser, setTypingUser] = useState(null);
            const endRef = useRef(null);

            // Define the full conversation history to pass back
            const fullConversation = useRef([
                { id: 1, sender: 'ai', name: 'Trio', text: "Hey you two. I connected you because you're both obsessed with finding the best Shawarma in New Haven, but have totally different opinions on Mamoun's." },
                { id: 2, sender: 'partner', name: 'Sarah', text: "Look, Mamoun's is iconic, but the hot sauce is just pain, not flavor. I said what I said. 😂" },
                { id: 3, sender: 'me', name: 'Me', text: "That is blasphemy! The heat is the whole point!" },
                { id: 4, sender: 'ai', name: 'Trio', text: "Careful Sarah, he's a purist. Maybe you two should go settle this debate at lunch? I see you both have a break at 12:30 PM." }
            ]);

            // AUTO PLAY
            useEffect(() => {
                let timeoutIds = [];
                // 1. Trio Intro
                timeoutIds.push(setTimeout(() => {
                    setMessages(prev => [...prev, fullConversation.current[0]]);
                }, 1000));
                // 2. Sarah
                timeoutIds.push(setTimeout(() => setTypingUser('Sarah'), 4000));
                timeoutIds.push(setTimeout(() => {
                    setTypingUser(null);
                    setMessages(prev => [...prev, fullConversation.current[1]]);
                }, 6000));
                // 3. Me
                timeoutIds.push(setTimeout(() => setTypingUser('Me'), 7500));
                timeoutIds.push(setTimeout(() => {
                    setTypingUser(null);
                    setMessages(prev => [...prev, fullConversation.current[2]]);
                }, 9500));
                // 4. Trio
                timeoutIds.push(setTimeout(() => {
                    setMessages(prev => [...prev, fullConversation.current[3]]);
                }, 11500));

                return () => timeoutIds.forEach(clearTimeout);
            }, []);

            useEffect(() => endRef.current?.scrollIntoView({ behavior: "smooth" }), [messages, typingUser]);

            return (
                <motion.div
                    initial={{ opacity: 0, x: 50 }}
                    animate={{ opacity: 1, x: 0 }}
                    exit={{ opacity: 0, x: 50 }}
                    className="flex flex-col h-full bg-white"
                >
                    {/* Header */}
                    <div className="bg-white border-b border-gray-100 p-3 flex items-center justify-between shadow-sm z-10">
                        <div className="flex items-center gap-3">
                            <button onClick={() => onBackWithHistory(messages)} className="p-2 hover:bg-gray-100 rounded-full transition-colors">
                                <ArrowLeft size={20} className="text-gray-600" />
                            </button>
                            <div className="flex -space-x-3">
                                <Avatar type="ai" size="sm" />
                                <Avatar name="Sarah" size="sm" />
                            </div>
                            <div>
                                <h1 className="text-md font-bold text-gray-900 leading-tight">Sarah, Trio</h1>
                                <span className="text-xs text-ai font-medium">Trio curated this group</span>
                            </div>
                        </div>
                    </div>

                    <div className="flex-1 overflow-y-auto p-4 bg-gray-50">
                        {messages.map((msg) => <ChatBubble key={msg.id} msg={msg} />)}

                        {typingUser && (
                            <motion.div initial={{ opacity: 0 }} animate={{ opacity: 1 }} className="flex flex-col items-start">
                                <span className="text-xs text-gray-500 mb-1 ml-1">{typingUser} is typing...</span>
                                <div className="bg-white border border-gray-100 p-3 rounded-2xl rounded-tl-none flex gap-1">
                                    <span className="w-1.5 h-1.5 bg-gray-400 rounded-full animate-bounce"></span>
                                    <span className="w-1.5 h-1.5 bg-gray-400 rounded-full animate-bounce" style={{ animationDelay: '0.1s' }}></span>
                                    <span className="w-1.5 h-1.5 bg-gray-400 rounded-full animate-bounce" style={{ animationDelay: '0.2s' }}></span>
                                </div>
                            </motion.div>
                        )}
                        <div ref={endRef}></div>
                    </div>

                    {/* Cosmetic Input */}
                    <div className="p-4 border-t border-gray-100 bg-white">
                        <div className="w-full h-12 bg-gray-50 rounded-full flex items-center px-4 text-gray-400">
                            Type a message...
                        </div>
                    </div>
                </motion.div>
            );
        };


        // --- MAIN APP ---
        const App = () => {
            // VIEW: 'HOME' | 'REQUEST' | 'CHAT_LIVE' | 'CHAT_STATIC'
            const [view, setView] = useState('HOME');
            const [activeChatId, setActiveChatId] = useState(null);

            // INITIAL DATA
            const [conversations, setConversations] = useState([
                {
                    id: 'c1',
                    isGroup: true,
                    partnerName: 'David',
                    title: 'David',
                    time: '9:41 AM',
                    preview: '<span class="text-ai font-medium">Trio:</span> Legendary. Ensure you hydrate.',
                    messages: [
                        { id: 1, sender: 'ai', name: 'Trio', text: "Gentlemen, suit up! Or rather, gym clothes up. @Me, meet @David. You both think leg day is negotiable (it's not). Go lift things." },
                        { id: 2, sender: 'me', name: 'Me', text: "Haha, busted. Hey David." },
                        { id: 3, sender: 'partner', name: 'David', text: "Lol guilty as charged. Nice to meet you man. Do you go to Payne Whitney?" },
                        { id: 4, sender: 'ai', name: 'Trio', text: "He does indeed. In fact, you're both free this Thursday at 5 PM. I've tentatively blocked out the squat rack. Don't let me down." },
                        { id: 5, sender: 'me', name: 'Me', text: "Thursday 5pm works for me." },
                        { id: 6, sender: 'partner', name: 'David', text: "Perfect. See you there." },
                        { id: 7, sender: 'ai', name: 'Trio', text: "Legendary. Ensure you hydrate." }
                    ]
                },
                {
                    id: 'c2',
                    isGroup: true,
                    partnerName: 'Jessica',
                    title: 'Jessica',
                    time: 'Yesterday',
                    preview: '<span class="text-ai font-medium">Trio:</span> It\'s going to be... wait for it... delightful.',
                    messages: [
                        { id: 1, sender: 'ai', name: 'Trio', text: "Haaaaave you met Jessica? @Me, Jessica is a UX wizard who hates clutter as much as you do. Jessica, @Me considers 'padding: 0px' a love language." },
                        { id: 2, sender: 'partner', name: 'Jessica', text: "Haha, accurate! Hi there! 👋" },
                        { id: 3, sender: 'me', name: 'Me', text: "Guilty! Great to meet you Jessica." },
                        { id: 4, sender: 'ai', name: 'Trio', text: "I sense a design system debate brewing. There's a new coffee spot 'Fika' that just opened. Quiet, minimalist, good espresso. I can book a table for 10am tomorrow?" },
                        { id: 5, sender: 'partner', name: 'Jessica', text: "Oh I've been meaning to try Fika! 10am works." },
                        { id: 6, sender: 'me', name: 'Me', text: "I'm in." },
                        { id: 7, sender: 'ai', name: 'Trio', text: "It's going to be... wait for it... delightful." }
                    ]
                }
            ]);

            const handleOpenChat = (id) => {
                setActiveChatId(id);
                setView('CHAT_STATIC');
            };

            const handleBackToHome = () => {
                setView('HOME');
                setActiveChatId(null);
            }

            const handleFinishLiveChat = (finalMessages) => {
                // Check if Sarah chat already exists to avoid duplicates (idempotency)
                if (!conversations.find(c => c.id === 'c3')) {
                    const newChat = {
                        id: 'c3',
                        isGroup: true,
                        partnerName: 'Sarah',
                        title: 'Sarah',
                        time: 'Now',
                        preview: '<span class="text-ai font-medium">Trio:</span> Careful Sarah, he\'s a purist...',
                        messages: finalMessages // Save the messages generated during the demo
                    };
                    setConversations(prev => [newChat, ...prev]);
                }
                setView('HOME');
            };

            return (
                <div className="flex justify-center items-center h-screen w-screen bg-gray-200">
                    <div className="w-full max-w-sm h-full max-h-[850px] sm:h-[800px] sm:rounded-[32px] bg-white sm:shadow-2xl overflow-hidden relative border-8 border-gray-900 sm:border-gray-900">
                        {/* Status Bar simulation */}
                        <div className="h-8 bg-white w-full flex justify-between items-center px-6 pt-2 z-50 relative">
                            <span className="text-xs font-bold text-black">9:41</span>
                            <div className="flex gap-1">
                                <div className="w-4 h-4 rounded-full bg-black/10"></div>
                                <div className="w-4 h-4 rounded-full bg-black/10"></div>
                            </div>
                        </div>

                        <div className="h-[calc(100%-2rem)] relative">
                            <AnimatePresence mode="wait">
                                {view === 'HOME' && (
                                    <HomeScreen
                                        key="home"
                                        conversations={conversations}
                                        onOpenRequest={() => setView('REQUEST')}
                                        onOpenChat={handleOpenChat}
                                    />
                                )}

                                {view === 'REQUEST' && (
                                    <RequestScreen
                                        key="request"
                                        onGoToChat={() => setView('CHAT_LIVE')}
                                        onBack={handleBackToHome}
                                    />
                                )}

                                {view === 'CHAT_LIVE' && (
                                    <ChatScreen
                                        key="chat-live"
                                        onBackWithHistory={handleFinishLiveChat}
                                    />
                                )}

                                {view === 'CHAT_STATIC' && (
                                    <StaticChatScreen
                                        key="chat-static"
                                        chat={conversations.find(c => c.id === activeChatId)}
                                        onBack={handleBackToHome}
                                    />
                                )}
                            </AnimatePresence>
                        </div>
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>

</html>
